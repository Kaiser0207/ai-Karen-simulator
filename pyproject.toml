[project]
name = "okeke-drill"
version = "0.1.0"
description = "AI 奧客應對演練 — AI 即時情緒模擬 × 危機溝通訓練"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "faster-whisper>=1.2.1",
    "gradio>=6.16.0",
    "langchain-core>=1.4.1",
    "langchain-google-genai>=4.2.4",
    "langgraph>=1.2.4",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "matplotlib>=3.10.9",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.23.0.39",
    "opencc>=1.3.1",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.49.0",
]

# 宣告自己為獨立 workspace 根目錄,不併入上層 /home/brant/Project 的 workspace
[tool.uv.workspace]
members = []

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
